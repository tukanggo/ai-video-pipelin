name: AI Video Pipeline Runner

on:
  # 1. 支持手动触发 (Ad-hoc)
  workflow_dispatch:

  # 2. 定时自动运行 (每天定时触发，例如 UTC 21:00)
  schedule:
    - cron: '0 21 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    # 💡 核心权限：显式申请仓库写入权限，彻底解决 Git 403 报错
    permissions:
      contents: write

    steps:
      # 第一步：拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 第二步：配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 第三步：安装项目运行所需的 Python 库
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai edge-tts

      # 第四步：运行 Python 脚本并注入环境变量
      - name: Run video pipeline script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python video_pipeline.py

      # 第五步：自动将生成的 voiceover.mp3 和 scene_image.jpg 提交并推送到 GitHub 根目录
      - name: Commit and push generated assets
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # 拉取最新变动，防止冲突
          git pull origin main || true
          
          # 添加生成的音频和图片文件
          git add voiceover.mp3 scene_image.jpg
          git commit -m "Auto-update latest voiceover and scene image [skip ci]" || echo "No changes to commit"
          
          # 推送到远程主分支
          git push origin main
