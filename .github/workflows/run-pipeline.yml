name: AI Video Pipeline Runner

on:
  # 1. 手动触发配置（Adhoc）
  workflow_dispatch:

  # 2. 定时自动运行配置（Schedule）- 每天早上 8:00 自动运行 (UTC时间)
  schedule:
    - cron: '0 21 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      # 第一步：拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 第二步：安装 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 第三步：安装依赖库（requests 和 google-generativeai）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai

      # 第四步：运行 Python 脚本，并注入我们在 Secrets 里藏好的密钥
      - name: Run video pipeline script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: |
          python video_pipeline.py
