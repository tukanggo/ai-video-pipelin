name: AI Video Pipeline Runner

on:
  # 1. 手动触发配置（Adhoc）
  workflow_dispatch:

  # 2. 定时自动运行配置（Schedule）- 每天早上 8:00 自动运行 (UTC时间 21:00)
  schedule:
    - cron: '0 21 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    # 💡 核心修复：显式向 GitHub 申请仓库的读写权限，解决 403 写入报错
    permissions:
      contents: write

    steps:
      # 第一步：拉取仓库代码（使用自带的 GITHUB_TOKEN 确保带权限）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 第二步：安装 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 第三步：安装依赖库（requests、google-generativeai、edge-tts）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai edge-tts

      # 第四步：运行 Python 脚本，并注入 Secrets 密钥和当前仓库名
      - name: Run video pipeline script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python video_pipeline.py

      # 第五步：自动将新生成的 voiceover.mp3 提交并推送到 GitHub 仓库根目录
      - name: Commit and push generated audio
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # 确保拉取最新状态，防止冲突
          git pull origin main || true
          
          # 检查并添加 mp3 文件
          git add voiceover.mp3
          git commit -m "Auto-update latest voiceover mp3 [skip ci]" || echo "No changes to commit"
          
          # 推送到 GitHub 主分支
          git push origin main
